version: "3.8"

services:
  # ── Backend Service (REST API, GIS Analytics, Agents) ──────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real_estate_backend
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LLAMA_SERVER_BASE_URL=http://host.docker.internal:8080/v1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PHOENIX_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_UI_URL=http://localhost:6006
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend Service (Ultra-lightweight Nginx Web Server) ─────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: real_estate_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ── Observability Service (Standalone Arize Phoenix Collector & UI) ────────
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: real_estate_phoenix
    ports:
      - "6006:6006"
    restart: unless-stopped

