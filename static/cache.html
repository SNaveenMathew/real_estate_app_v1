<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none'">
  <title>Ontology · Real Estate Intelligence</title>
  <link rel="stylesheet" href="/static/cache.css?v=1">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/">🏠 Real Estate Intelligence</a>
      <span class="crumb">Ontology</span>
    </div>
    <nav class="topbar-right" aria-label="Site">
      <button class="btn-panel-toggle" id="btn-toggle-panel" type="button" aria-expanded="false"
              title="Toggle the inspector">🔎 Details</button>
      <a class="nav-link" href="/data">Data model</a>
      <a class="nav-link" href="/">Map and chat</a>
    </nav>
  </header>

  <main class="cm">
    <section class="cm-map" aria-labelledby="ontology-title">
      <div class="cm-stats" id="stats" aria-live="polite">
        <p class="muted pad">Loading the ontology…</p>
      </div>

      <div class="cm-head">
        <div class="cm-title">
          <h1 id="ontology-title">What the data model means, and how it connects</h1>
          <p class="muted" id="ontology-summary">Classes, properties and relations derived from the live catalog.</p>
        </div>
        <div class="cm-tools">
          <div class="seg" role="group" aria-label="Granularity">
            <button type="button" id="view-overview" aria-pressed="false">Overview</button>
            <button type="button" id="view-standard" class="on" aria-pressed="true">Model</button>
            <button type="button" id="view-full" aria-pressed="false">Full detail</button>
          </div>
          <input type="search" id="ontology-search" placeholder="Find a concept, table, column or area"
                 aria-label="Find a concept, table, column or area">
          <div class="zoom-toolbar" role="toolbar" aria-label="Zoom controls">
            <button class="btn-zoom" id="btn-zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out">−</button>
            <button class="btn-zoom-level" id="btn-zoom-reset" type="button" title="Reset zoom to 100%"><span id="zoom-level">100%</span></button>
            <button class="btn-zoom" id="btn-zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
            <button class="btn-zoom-fit" id="btn-zoom-fit" type="button" title="Fit graph to width">Fit</button>
          </div>
        </div>
      </div>

      <div class="legend" id="legend" aria-label="Legend"></div>
      <div class="cm-canvas" id="canvas" tabindex="-1"><p class="muted pad">Loading…</p></div>
    </section>

    <aside class="cm-panel" id="panel" aria-label="Inspector">
      <div class="ins-head">
        <div class="ins-title" id="ins-title">Details</div>
        <button class="btn-close-panel" id="btn-close-panel" type="button" aria-label="Close inspector">✕</button>
      </div>
      <div id="ins-body"><p class="muted">Select a class or property to see how it is defined and what it connects to.</p></div>
    </aside>
  </main>

  <script src="/static/cache.js?v=1"></script>
</body>
</html>
