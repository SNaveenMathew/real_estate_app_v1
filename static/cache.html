<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cache · Real Estate Intelligence</title>
  <link rel="stylesheet" href="/static/cache.css?v=1">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/">🏠 Real Estate Intelligence</a>
      <span class="crumb">Cache</span>
    </div>
    <nav class="topbar-right" aria-label="Site">
      <button class="btn-panel-toggle" id="btn-toggle-panel" type="button" aria-expanded="false"
              title="Toggle the inspector">🔎 Details</button>
      <a class="nav-link" href="/data">Data model</a>
      <a class="nav-link" href="/">Map and chat</a>
    </nav>
  </header>

  <main class="cm">
    <section class="cm-map" aria-labelledby="cache-title">
      <div class="cm-stats" id="stats" aria-live="polite">
        <p class="muted pad">Loading the cache…</p>
      </div>

      <div class="cm-head">
        <div class="cm-title">
          <h1 id="cache-title">What the assistant has reused</h1>
          <p class="muted" id="cache-summary">Each box is a piece of work that did not have to be redone.</p>
        </div>
        <div class="cm-tools">
          <div class="seg" role="group" aria-label="Graph level">
            <button type="button" id="view-questions" class="on" aria-pressed="true">Questions</button>
            <button type="button" id="view-prompts" aria-pressed="false">Model calls</button>
          </div>
          <input type="search" id="cache-search" placeholder="Find a question, concept or table" aria-label="Find a question, concept or table">
          <label class="check"><input type="checkbox" id="opt-empty" checked> Show concepts with no reuse yet</label>
          <div class="zoom-toolbar" role="toolbar" aria-label="Zoom controls">
            <button class="btn-zoom" id="btn-zoom-out" type="button" title="Zoom out (−)" aria-label="Zoom out">−</button>
            <button class="btn-zoom-level" id="btn-zoom-reset" type="button" title="Reset zoom to 100%"><span id="zoom-level">100%</span></button>
            <button class="btn-zoom" id="btn-zoom-in" type="button" title="Zoom in (+)" aria-label="Zoom in">+</button>
            <button class="btn-zoom-fit" id="btn-zoom-fit" type="button" title="Fit graph to width">Fit</button>
          </div>
          <button class="btn danger" id="btn-clear" type="button">Clear cache</button>
        </div>
      </div>

      <div class="legend" id="legend" aria-label="Legend"></div>
      <div class="cm-canvas" id="canvas" tabindex="-1"><p class="muted pad">Loading…</p></div>
    </section>

    <aside class="cm-panel" id="panel" aria-label="Inspector">
      <div class="ins-head">
        <div class="ins-title" id="ins-title">Details</div>
        <button class="btn-close-panel" id="btn-close-panel" type="button" aria-label="Close inspector">✕</button>
      </div>
      <div id="ins-body"><p class="muted">Select a node in the graph to see what it holds.</p></div>
    </aside>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="/static/cache.js?v=1"></script>
</body>
</html>
