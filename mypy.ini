[mypy]
# A baseline, not a conversion: the modules listed here are the ones written with type hints
# (the evaluation scaffolding and the two services added for the audit's recommendations).
# Checking the whole 100-module codebase untyped would produce thousands of errors and no
# signal; widening this list is the ratchet, the same way catalog_lint treats new findings.
python_version = 3.13
files = services/http_client.py,services/session_memory.py,eval/calibration.py,eval/real_data.py,agents/tool_result.py,agents/capabilities.py
ignore_missing_imports = True
# The baseline checks the listed modules, not their dependencies: following 100 untyped
# imports would bury six checked files in 115 errors from elsewhere.
follow_imports = silent
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
